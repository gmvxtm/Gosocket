# The central API signs the token and the sync service verifies it: both need the same key.
# Development value; a real deployment injects it from the environment.
x-jwt-key: &jwt-key "development-only-signing-key-change-me-please"

services:
  postgres-local:
    image: postgres:18-alpine
    container_name: offline-requests-local-db
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: requests_local
    ports:
      - "5432:5432"
    volumes:
      - local-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d requests_local"]
      interval: 5s
      timeout: 3s
      retries: 10

  postgres-central:
    image: postgres:18-alpine
    container_name: offline-requests-central-db
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: requests_central
    ports:
      - "5433:5432"
    volumes:
      - central-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d requests_central"]
      interval: 5s
      timeout: 3s
      retries: 10

  dashboard:
    image: mcr.microsoft.com/dotnet/aspire-dashboard:latest
    container_name: offline-requests-dashboard
    environment:
      # Development tool on loopback: no login, so the telemetry is one click away.
      DOTNET_DASHBOARD_UNSECURED_ALLOW_ANONYMOUS: "true"
    ports:
      - "127.0.0.1:18888:18888"

  backend:
    build: ./backend
    container_name: offline-requests-backend
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Default: Host=postgres-central;Port=5432;Database=requests_central;Username=app;Password=app
      OTEL_EXPORTER_OTLP_ENDPOINT: http://dashboard:18889
      Jwt__Key: *jwt-key
    ports:
      - "127.0.0.1:5080:8080"
    depends_on:
      postgres-central:
        condition: service_healthy
      dashboard:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-qO", "-", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 20s

  sync-service:
    build: ./sync-service
    container_name: offline-requests-sync
    environment:
      DATABASE_URL: postgres://app:app@postgres-local:5432/requests_local
      BACKEND_URL: http://backend:8080
      # The Node exporter speaks OTLP over HTTP; .NET uses the gRPC port of the same dashboard.
      OTEL_EXPORTER_OTLP_ENDPOINT: http://dashboard:18890
      JWT_SECRET: *jwt-key
    ports:
      - "127.0.0.1:3001:3001"
    depends_on:
      postgres-local:
        condition: service_healthy
      backend:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-qO", "-", "http://127.0.0.1:3001/health"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s

  web:
    build:
      context: ./web
      args:
        # The browser runs on the host, so it points at the published sync-service port.
        VITE_SYNC_SERVICE_URL: http://localhost:3001
    container_name: offline-requests-web
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      sync-service:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-qO", "-", "http://127.0.0.1/"]
      interval: 10s
      timeout: 3s
      retries: 6

  # Same application built for a client that cannot run the local service, such as a phone:
  # the queue lives in IndexedDB and the service is only contacted to synchronize.
  web-browser:
    build:
      context: ./web
      args:
        VITE_SYNC_SERVICE_URL: http://localhost:3001
        VITE_LOCAL_STORE: browser
    container_name: offline-requests-web-browser
    ports:
      - "127.0.0.1:8081:80"
    depends_on:
      sync-service:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-qO", "-", "http://127.0.0.1/"]
      interval: 10s
      timeout: 3s
      retries: 6

volumes:
  local-data:
  central-data:
